[tox]
envlist = flake8, api-sqlite
isolated_build = True
skip_missing_interpreters = True

[flake8]
accept-encodings = utf-8
require-code = true

[testenv]
# Base + tests only. The historical `requirements.txt` / `requirements-dev.txt` /
# `requirements-extra.txt` paths never existed in this layout; the compiled
# lockfiles live in requirements/ and are Python 3.11.
deps =
    -r requirements/base.txt
    -r requirements/tests.txt

[testenv:flake8]
skip_install = True
deps = flake8
commands =
    flake8 {toxinidir}/

[testenv:black]
skip_install = True
deps = black
commands =
    black --check setup.py pgappforge tests

# Default gate. Mirrors the invocation used by .github/workflows/ci.yml so a
# local green run means the same thing CI green means.
[testenv:tests]
setenv =
    SQLALCHEMY_DATABASE_URI = sqlite:///
commands =
    nose2 -c setup.cfg -F -v --with-coverage --coverage pgappforge -A '!mongo,!openid' tests

[testenv:api-sqlite]
setenv =
    SQLALCHEMY_DATABASE_URI = sqlite:///
commands =
    nose2 -c setup.cfg -F -v --with-coverage --coverage pgappforge -A '!mongo,!openid' tests

[testenv:mysql]
setenv =
    SQLALCHEMY_DATABASE_URI = mysql://mysqluser:mysqluserpassword@0.0.0.0/app?charset=utf8
deps =
    -r requirements/base.txt
    -r requirements/tests.txt
    -r requirements/extra.txt
commands =
    nose2 -c setup.cfg -F -v --with-coverage --coverage pgappforge -A '!mongo,!openid' tests

[testenv:postgres]
setenv =
    SQLALCHEMY_DATABASE_URI = postgresql+psycopg2://pguser:pguserpassword@0.0.0.0/app
deps =
    -r requirements/base.txt
    -r requirements/tests.txt
    -r requirements/extra.txt
commands =
    nose2 -c setup.cfg -F -v --with-coverage --coverage pgappforge -A '!mongo,!openid' tests

[testenv:mssql]
setenv =
    SQLALCHEMY_DATABASE_URI = mssql+pymssql://sa:Password_123@localhost:1433/master
deps =
    -r requirements/base.txt
    -r requirements/tests.txt
    -r requirements/extra.txt
commands =
    nose2 -c setup.cfg -F -v --with-coverage --coverage pgappforge -A '!mongo,!openid' tests

[testenv:mongodb]
deps =
    -r requirements/base.txt
    -r requirements/tests.txt
    -r requirements/mongodb.txt
commands =
    nose2 -c setup.cfg -F -v --with-coverage --coverage pgappforge -A 'mongo' tests