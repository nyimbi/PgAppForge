[tox]
envlist = lint, py
isolated_build = True
skip_missing_interpreters = True

[flake8]
accept-encodings = utf-8
require-code = true

[testenv]
deps =
    -r requirements/base.txt
    -r requirements/tests.txt

# Local `tox -e py` runs need a reachable PostgreSQL — this project has no
# SQLite fallback by design. Point at your own server with:
#   PGAF_TEST_DATABASE_URI=postgresql+psycopg2://user:pass@host:5432/db tox -e py
[testenv:lint]
skip_install = True
deps = flake8
commands =
    python -m compileall -q {toxinidir}/pgappforge
    flake8 pgappforge tests

[testenv:py]
setenv =
    SQLALCHEMY_DATABASE_URI = {env:PGAF_TEST_DATABASE_URI:postgresql+psycopg2://pguser:pguserpassword@localhost:5432/app}
commands =
    pytest tests/ci -q

[testenv:black]
skip_install = True
deps = black
commands =
    black --check setup.py pgappforge tests
