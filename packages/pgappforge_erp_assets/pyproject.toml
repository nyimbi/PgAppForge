[project]
name = "pgappforge-erp-assets"
version = "0.1.0"
description = "Fixed Assets — asset register, depreciation schedules, disposals, impairment"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Nyimbi Odero", email = "nyimbi+pgaf@gmail.com"}]
readme = "README.md"
keywords = ["pgappforge", "erp", "assets", "fixed-assets", "depreciation", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "pgappforge>=0.90.0",
    "pgappforge-erp-foundation>=0.1.0",
    "pgappforge-erp-gl>=0.1.0",
]

[project.entry-points."pgappforge.plugins"]
erp_assets = "pgappforge.plugins.erp.finance.assets:AssetsPlugin"

[project.urls]
Homepage = "https://github.com/pgappforge/pgappforge"
Documentation = "https://pgappforge.dev/plugins/erp/assets"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]
