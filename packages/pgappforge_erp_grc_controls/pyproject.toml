[project]
name = "pgappforge-erp-grc-controls"
version = "0.1.0"
description = "GRC Controls — control library, risk register, assessments, SOX/ISO compliance"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Nyimbi Odero", email = "nyimbi+pgaf@gmail.com"}]
readme = "README.md"
keywords = ["pgappforge", "erp", "grc", "controls", "risk", "compliance", "sox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "pgappforge>=0.90.0",
    "pgappforge-erp-foundation>=0.1.0",
]

[project.entry-points."pgappforge.plugins"]
erp_grc_controls = "pgappforge.plugins.erp.grc.controls:GRCControlsPlugin"

[project.urls]
Homepage = "https://github.com/pgappforge/pgappforge"
Documentation = "https://pgappforge.dev/plugins/erp/grc_controls"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]
