[project]
name = "pgappforge-erp-hr-personnel"
version = "0.1.0"
description = "HR Personnel — employee lifecycle, contracts, absences, documents"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Nyimbi Odero", email = "nyimbi+pgaf@gmail.com"}]
readme = "README.md"
keywords = ["pgappforge", "erp", "hr", "personnel", "employees", "contracts", "hcm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "pgappforge>=0.90.0",
    "pgappforge-erp-foundation>=0.1.0",
    "pgappforge-erp-hr-org>=0.1.0",
]

[project.entry-points."pgappforge.plugins"]
erp_hr_personnel = "pgappforge.plugins.erp.hcm.personnel:PersonnelPlugin"

[project.urls]
Homepage = "https://github.com/pgappforge/pgappforge"
Documentation = "https://pgappforge.dev/plugins/erp/hr_personnel"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]
