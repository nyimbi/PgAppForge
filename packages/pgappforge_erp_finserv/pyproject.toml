[project]
name = "pgappforge-erp-finserv"
version = "0.1.0"
description = "Financial Services vertical — instruments, positions, regulatory capital, AML"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Nyimbi Odero", email = "nyimbi+pgaf@gmail.com"}]
readme = "README.md"
keywords = ["pgappforge", "erp", "finserv", "financial-services", "instruments", "aml", "industry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "pgappforge>=0.90.0",
    "pgappforge-erp-foundation>=0.1.0",
    "pgappforge-erp-gl>=0.1.0",
    "pgappforge-erp-grc-controls>=0.1.0",
]

[project.entry-points."pgappforge.plugins"]
erp_finserv = "pgappforge.plugins.erp.industry.financial_services:FinancialServicesPlugin"

[project.urls]
Homepage = "https://github.com/pgappforge/pgappforge"
Documentation = "https://pgappforge.dev/plugins/erp/finserv"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]
