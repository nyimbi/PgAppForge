version: "3.7"

# ── PgAppForge development stack ──────────────────────────────────────────────
# Usage:
#   docker compose up -d postgres          # DB only (for local dev with venv)
#   docker compose up -d                   # Full stack including app
#   docker compose exec app flask fab create-admin
#   docker compose exec app flask db upgrade
#
# Copy .env.example → .env and fill in SECRET_KEY before starting.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Application ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: pgappforge-app
    restart: unless-stopped
    env_file: .env
    environment:
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://pguser:pguserpassword@postgres:5432/app
      FLASK_ENV: development
      FLASK_DEBUG: "1"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - .:/app            # mount source for hot-reload in dev
    command: >
      flask run --host=0.0.0.0 --port=8080 --reload

  # ── Worker (batch scheduler) ──────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: pgappforge-worker
    restart: unless-stopped
    env_file: .env
    environment:
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://pguser:pguserpassword@postgres:5432/app
    depends_on:
      - postgres
    command: >
      flask fab run-scheduler
    profiles:
      - worker   # opt-in: docker compose --profile worker up

  postgres:
    container_name: fab-postgres
    image: postgres:14
    restart: unless-stopped
    env_file: .env
    command: postgres -c 'max_connections=500'
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: pguserpassword
      POSTGRES_USER: pguser
    ports:
      - 5432:5432
  mongo:
    container_name: fab-mongo
    image: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: app
    ports:
      - 27017:27017
  ldap:
    container_name: fab-ldap
    image: bitnami/openldap:2.6.4
    environment:
      LDAP_URI: ldap://openldap:1389
      LDAP_BASE: dc=example,dc=org
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: admin_password
      LDAP_CUSTOM_LDIF_DIR: /ldifs
      LDAP_EXTRA_SCHEMAS: cosine,inetorgperson,nis,memberof
    volumes:
      - './docker/openldap/ldifs:/ldifs'
      - './docker/openldap/schemas/memberof.ldif:/opt/bitnami/openldap/etc/schema/memberof.ldif'
    ports:
      - 1389:1389
