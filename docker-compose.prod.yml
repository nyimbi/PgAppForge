version: "3.7"

# ── PgAppForge production overlay ─────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from dev:
#   • gunicorn instead of flask run (multi-worker, pre-fork)
#   • No source volume mount — uses the image built from Dockerfile
#   • OTEL_ENABLED=true — traces exported to your OTLP collector
#   • Health checks on the app container
#   • Nginx reverse proxy with TLS termination
#   • Resource limits on app and worker containers
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: pgappforge-app
    restart: unless-stopped
    env_file: .env
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://pguser:pguserpassword@postgres:5432/app"
      FLASK_ENV: "production"
      FLASK_DEBUG: "0"
      OTEL_ENABLED: "true"
      # Override OTEL_EXPORTER_ENDPOINT in .env with your collector address
    volumes:
      # No source mount in prod — baked into image
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    # gunicorn: 4 sync workers, 120-s timeout, access log to stdout
    command: >
      gunicorn
        --bind 0.0.0.0:8080
        --workers 4
        --timeout 120
        --access-logfile -
        --error-logfile -
        --log-level info
        "app:create_app()"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    profiles:
      - prod

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: pgappforge-worker
    restart: unless-stopped
    env_file: .env
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://pguser:pguserpassword@postgres:5432/app"
      FLASK_ENV: "production"
      OTEL_ENABLED: "true"
    volumes:
      - app_logs:/app/logs
    command: flask fab run-scheduler
    healthcheck:
      test: ["CMD", "flask", "fab", "worker-status"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    profiles:
      - prod
      - worker

  # ── Nginx TLS termination ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: pgappforge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - prod

  # ── Jaeger all-in-one (optional OTel backend — swap for Tempo/Datadog) ────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: pgappforge-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC ingest
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - otel

volumes:
  app_logs:
    driver: local
  app_uploads:
    driver: local
