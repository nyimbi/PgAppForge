[unittest]
plugins = nose2.plugins.attrib

[coverage]
always-on = True
coverage = pgappforge

[flake8]
import-order-style = google
max-line-length = 90
exclude = .tox,build,docs,bin,examples,pgappforge/templates,pgappforge/static,venv
ignore = E203,W503,W605

[mypy]
follow_imports=skip
ignore_missing_imports=True
ignore_errors = True

[mypy-pgappforge.validators]
ignore_errors = False
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
warn_unused_ignores = false

[mypy-pgappforge.base]
ignore_errors = False
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
warn_unused_ignores = false

[mypy-pgappforge.api.convert]
ignore_errors = False
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
warn_unused_ignores = false
