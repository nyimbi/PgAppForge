[unittest]
plugins = nose2.plugins.attrib

[flake8]
import-order-style = google
max-line-length = 90
# Tabs are the project convention (see pjs/CLAUDE.md), so pycodestyle's
# indentation complaints are noise, not defects.
extend-ignore = W191,E101,E117,E126,E128,W503,W605,E203
exclude = .venv,.tox,build,docs,bin,examples,docs/improvements,pgappforge/templates,pgappforge/static

[mypy]
# Type checking is opt-in per module. Everything not listed here is unchecked.
files =
    pgappforge/validators.py,
    pgappforge/base.py,
    pgappforge/api/convert.py,
follow_imports=skip
ignore_missing_imports=True

[mypy-pgappforge.validators]
ignore_errors = False
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
warn_unused_ignores = false

[mypy-pgappforge.base]
ignore_errors = False
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
warn_unused_ignores = false

[mypy-pgappforge.api.convert]
ignore_errors = False
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
warn_unused_ignores = false
