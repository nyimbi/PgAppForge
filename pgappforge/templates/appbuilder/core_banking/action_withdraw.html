{% extends 'appbuilder/base.html' %}

{% block content %}
<div class="container" style="max-width: 600px;">
  <div class="page-header">
    <h1>Withdraw Funds</h1>
    <p class="text-muted">Account: <strong>{{ account_number }}</strong></p>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="POST">
        <div class="mb-3">
          <label for="amount_cents" class="form-label">Amount (KES)</label>
          <input type="number" class="form-control" id="amount_cents" name="amount_cents"
                 min="0.01" step="0.01" required placeholder="e.g. 500.00">
        </div>
        <div class="mb-3">
          <label for="channel" class="form-label">Channel</label>
          <select class="form-select" id="channel" name="channel">
            <option value="BRANCH">Branch</option>
            <option value="ATM">ATM</option>
            <option value="MOBILE">Mobile</option>
            <option value="ONLINE">Online</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="reference" class="form-label">Reference</label>
          <input type="text" class="form-control" id="reference" name="reference"
                 maxlength="100" placeholder="e.g. CASH-WD-001">
        </div>
        <div class="mb-3">
          <label for="narrative" class="form-label">Narrative (optional)</label>
          <input type="text" class="form-control" id="narrative" name="narrative"
                 maxlength="200">
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">
            <i class="fa fa-arrow-up"></i> Post Withdrawal
          </button>
          <a href="{{ url_for('AccountView.list') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
