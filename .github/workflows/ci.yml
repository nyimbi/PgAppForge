# Python unit tests
name: Python

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  lint:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev
          pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install flake8 black
      # compileall first: an unparseable module should fail in one second,
      # not after a full lint pass has already burned the runner's minutes.
      - name: Syntax check
        run: python -m compileall -q pgappforge
      - name: black
        run: black --check setup.py pgappforge
      - name: flake8 (package)
        run: flake8 pgappforge
      - name: flake8 (tests)
        run: flake8 tests

  test-postgres:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.14"]
    env:
      SQLALCHEMY_DATABASE_URI:
        postgresql+psycopg2://pguser:pguserpassword@127.0.0.1:15432/app
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pguserpassword
          POSTGRES_DB: app
        ports:
          - 15432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run openldap
        run: |
          docker run -d \
            -v '${{ github.workspace }}/docker/openldap/ldifs:/ldifs' \
            -v '${{ github.workspace }}/docker/openldap/schemas/memberof.ldif:/opt/bitnami/openldap/etc/schema/memberof.ldif' \
            -e LDAP_URI=ldap://openldap:1389 \
            -e LDAP_BASE=dc=example,dc=org \
            -e LDAP_ADMIN_USERNAME=admin \
            -e LDAP_ADMIN_PASSWORD=admin_password \
            -e LDAP_EXTRA_SCHEMAS=cosine,inetorgperson,nis,memberof \
            -p 1389:1389 \
            bitnami/openldap:2.6.4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/tests.txt
          pip install -r requirements/extra.txt
      - name: Run tests
        run: pytest tests/ci -q
      - name: Upload code coverage
        run: |
          bash <(curl -s https://codecov.io/bash) -cF python

  test-openid:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev
          pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/tests.txt
          pip install -r requirements/extra.txt
          pip install -r requirements/openid.txt
      - name: Run tests
        run: pytest tests/ci -q -m openid
      - name: Upload code coverage
        run: |
          bash <(curl -s https://codecov.io/bash) -cF python
